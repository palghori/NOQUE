# Render Blueprint — One-click deploy for NOQUE
# https://render.com/docs/blueprint-spec

services:
  # ── Backend (FastAPI) ──────────────────────────────
  - type: web
    name: noque-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noque-db
          property: connectionString
        # Render provides a postgres:// URL; we need postgresql+asyncpg://
      - key: GEMINI_API_KEY
        sync: false  # User must set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: CORS_ORIGINS
        value: "*"
      - key: MAX_FILE_SIZE_MB
        value: "25"
      - key: COVERAGE_THRESHOLD
        value: "60"
      - key: MAX_TEST_RETRIES
        value: "3"



# ── PostgreSQL Database ──────────────────────────────
databases:
  - name: noque-db
    plan: free
    databaseName: noque
    user: noque
